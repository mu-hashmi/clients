name: daytona snapshot delete
synopsis: Delete a snapshot
usage: daytona snapshot delete [SNAPSHOT_ID | SNAPSHOT_NAME] [flags]
options:
    - name: all
      shorthand: a
      default_value: "false"
      usage: Delete all snapshots
inherited_options:
    - name: help
      default_value: "false"
      usage: help for daytona
    - name: no-input
      default_value: "false"
      usage: Disable interactive prompts and browser-based flows
see_also:
    - daytona snapshot - Manage Daytona snapshots
