name: daytona info
synopsis: Get sandbox info
usage: daytona info [SANDBOX_ID] | [SANDBOX_NAME] [flags]
options:
    - name: format
      shorthand: f
      usage: Output format. Must be one of (yaml, json)
inherited_options:
    - name: help
      default_value: "false"
      usage: help for daytona
    - name: no-input
      default_value: "false"
      usage: Disable interactive prompts and browser-based flows
see_also:
    - daytona - Daytona CLI
